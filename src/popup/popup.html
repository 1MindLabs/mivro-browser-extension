<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="popup.css" />
    <title>Mivro</title>
  </head>

  <body>
    <div class="header">
      <img
        class="mivro-icon"
        src="../../assets/icons/misc/mivro.svg"
        alt="mivro"
      />
    </div>

    <div class="chat container hidden">
      <div class="input-container">
        <textarea class="inp" placeholder="Message..." rows="1"></textarea>
        <div class="send icon-div" id="send-button">
          <img src="../../assets/icons/misc/send.png" alt="send" class="icon" />
        </div>
      </div>
    </div>
    <div class="marketplace container hidden">
      <div class="temp-para">Coming Soon</div>
    </div>
    <div class="search container hidden">
      <div class="search-container">
        <div class="send icon-div">
          <img
            src="../../assets/icons/misc/search.png"
            alt="search"
            class="icon"
          />
        </div>
        <textarea class="inp" placeholder="Search..." rows="1"></textarea>
        <div class="spinner hidden"></div>
      </div>
    </div>
    <div class="profile container hidden">
      <div class="profile-header">
        <div class="profile-image">
          <div class="profile-avatar" id="profile-avatar"></div>
        </div>
        <div class="profile-info">
          <div class="profile-name" id="profile-name">Loading...</div>
          <div class="profile-email" id="profile-email"></div>
        </div>
      </div>

      <div class="account-settings profile-option">
        <div class="profile-text">Account Settings</div>
        <div>
          <img src="../../assets/icons/misc/arrow.png" alt="Arrow Icon" />
        </div>
      </div>
      <div class="privicy-security profile-option">
        <div class="profile-text">Privacy and Security</div>
        <div>
          <img src="../../assets/icons/misc/arrow.png" alt="Arrow Icon" />
        </div>
      </div>
      <div class="activity-records profile-option">
        <div class="profile-text">Activity and Records</div>
        <div>
          <img src="../../assets/icons/misc/arrow.png" alt="Arrow Icon" />
        </div>
      </div>
      <div class="notifications-preference profile-option">
        <div class="profile-text">Notification Preferences</div>
        <div>
          <img src="../../assets/icons/misc/arrow.png" alt="Arrow Icon" />
        </div>
      </div>
      <div class="support-feedback profile-option">
        <div class="profile-text">Support and Feedback</div>
        <div>
          <img src="../../assets/icons/misc/arrow.png" alt="Arrow Icon" />
        </div>
      </div>

      <div class="logout">
        <img src="../../assets/icons/misc/logout.png" alt="Logout" />
        Logout
      </div>
    </div>

    <!-- Navigation bar -->
    <nav class="navigation">
      <ul class="nav-list">
        <li>
          <a href="#">
            <img
              class="grey"
              src="../../assets/icons/navigation/chat.png"
              alt="chat"
              id="chat-nav"
            />
            Chat
          </a>
        </li>
        <li>
          <a href="#">
            <img
              class="grey"
              src="../../assets/icons/navigation/marketplace.png"
              alt="marketplace"
            />
            Marketplace
          </a>
        </li>
        <li>
          <a href="#">
            <img
              class="grey"
              src="../../assets/icons/navigation/search.png"
              alt="search"
            />
            Search
          </a>
        </li>
        <li class="active">
          <a href="#">
            <img
              src="../../assets/icons/navigation/profile.png"
              alt="profile"
            />
            Profile
          </a>
        </li>
        <div class="active-bar"></div>
      </ul>
    </nav>

    <script type="module" src="popup.js"></script>
  </body>
</html>
